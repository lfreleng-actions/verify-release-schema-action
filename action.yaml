# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: "verify-release-schema"
description: "Verify a release file's contents against an approved schema"

inputs:
  distribution-type:
    description: >
      The content type of the release. Accepted values (case-sensitive,
      lowercase): artifact, container, maven, npm, packagecloud, pypi.
    required: true
  release-file:
    description: "File that describes the release contents"
    required: true
  lftools-uv-version:
    description: >
      Optional exact version of lftools-uv to run via uvx. When set,
      the value is interpolated into `lftools-uv==<value>`, so it
      MUST be a plain version string (for example `0.1.8`), not a
      full PEP 440 pip specifier. Leave unset (the default) to use
      the latest version published on PyPI.
    required: false
    default: ""
  schema-ref:
    description: >
      DEPRECATED and ignored. Schemas used to be downloaded from
      lfit/releng-global-jjb at this ref; the action now validates
      against the schemas bundled in its own schemas/ directory, so the
      action's own pinned version fixes the schema revision. Setting
      it only emits a deprecation warning.
    required: false
    default: ""

# Scalar fields common to the release schemas. Without these a consumer
# re-parses the release file itself, duplicating the YAML handling this
# action already performs and risking the two disagreeing.
#
# String values are emitted verbatim; the boolean tag_release is
# rendered as lowercase true/false. git_tag in particular is NOT
# defaulted to version: global-jjb's release-job.sh applies that
# fallback, but doing it here would report a value the file does not
# contain, and a caller wanting the fallback can express it in a single
# expression.
#
# Only fields the release lanes consume appear here. Type-specific
# scalars (package_name, pypi_project, container_release_tag) and the
# list-valued fields (artifacts, containers, packages) are deliberately
# absent; outputs must be declared statically, so adding them is a
# decision to take per consumer rather than preemptively.
outputs:
  distribution_type:
    description: "Release content type declared in the release file"
    value: "${{ steps.release-fields.outputs.distribution_type }}"
  project:
    description: "Project the release file names"
    value: "${{ steps.release-fields.outputs.project }}"
  version:
    description: "Version being released"
    value: "${{ steps.release-fields.outputs.version }}"
  git_tag:
    description: >
      Git tag named by the release file. Empty when absent; callers
      wanting global-jjb's fallback should use `git_tag || version`.
    value: "${{ steps.release-fields.outputs.git_tag }}"
  log_dir:
    description: >
      Jenkins log directory locating the staging build. Empty when
      absent.
    value: "${{ steps.release-fields.outputs.log_dir }}"
  ref:
    description: "Commit the release was built from. Empty when absent."
    value: "${{ steps.release-fields.outputs.ref }}"
  tag_release:
    description: >
      Whether to tag the repository, as 'true' or 'false'. Empty when
      the field is absent; global-jjb treats absent as true.
    value: "${{ steps.release-fields.outputs.tag_release }}"

runs:
  using: "composite"
  steps:
    # Install uv (which provides `uv tool run`, alias `uvx`) on the
    # runner. A composite action inherits the caller job's environment,
    # so nothing below may let a caller's PATH, UV_PYTHON, VIRTUAL_ENV,
    # CONDA_PREFIX or similar choose the interpreter the action runs.
    #
    # setup-uv's only uv call for these inputs is "uv python find",
    # whose result it executes. An invalid preference makes uv refuse
    # its arguments before any lookup; setup-uv then reports the
    # Python version as "unknown", which nothing reads. Pointing
    # working-directory at the action's own directory keeps setup-uv
    # from reading a required-version from the caller's files: the
    # action ships neither uv.toml nor pyproject.toml, so the latest
    # uv is installed. These variables apply to this step only.
    - name: "Install uv"
      id: setup-uv
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        working-directory: "${{ github.action_path }}"
        # Without it setup-uv puts the caller's HOME/XDG_* bin dir on PATH
        tool-bin-dir: "${{ runner.temp }}/verify-release-schema/bin"
        # GitHub Actions caching stays off. A restored cache feeds the
        # environment that validates the release file and extracts the
        # outputs gating a release, and a cache written by a
        # less-trusted run in the same scope would be trusted on
        # restore (cache poisoning, CWE-349). setup-uv's default,
        # 'auto', caches on push events, so only an explicit false
        # disables it; the post-step "uv cache prune" would also hit
        # the invalid preference below. A cold install costs seconds.
        enable-cache: false
      env:
        UV_NO_CONFIG: '1'
        UV_NO_PROJECT: '1'
        UV_PYTHON_PREFERENCE: 'lookup-disabled'
        # Inherited, it makes setup-uv probe uv, which the line above fails
        UV_PYTHON_ARCH: ''
        # yamllint disable-line rule:line-length
        UV_PYTHON_INSTALL_DIR: "${{ runner.temp }}/verify-release-schema/python"

    # A trusted interpreter: uv installs its own pinned, hash-checked
    # build. uv runs with an empty environment plus an allow-list, so
    # no caller variable can pick or redirect the interpreter. Every
    # later uv and Python start names this interpreter by its path.
    - name: "Install Python"
      id: python
      shell: bash
      working-directory: "${{ github.action_path }}"
      env:
        UV: "${{ steps.setup-uv.outputs.uv-path }}"
        INSTALL_DIR: "${{ runner.temp }}/verify-release-schema/python"
        CACHE_DIR: "${{ runner.temp }}/verify-release-schema/cache"
        PYTHON_VERSION: '3.13'
      run: |
        set -euo pipefail
        clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
          "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR" "UV_CACHE_DIR=$CACHE_DIR")
        for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
            https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
            UV_NATIVE_TLS; do
          if [ -n "${!name+set}" ]; then clean+=("$name=${!name}"); fi
        done
        # uv python find also searches the working directory and its
        # parents for a .venv and runs the interpreter there before
        # rejecting it as unmanaged. With 'uses: ./' the action
        # directory is the caller's workspace, so look up from the
        # action's own install directory instead.
        mkdir -p "$INSTALL_DIR"
        cd "$INSTALL_DIR"
        env -i "${clean[@]}" "$UV" python install --quiet --no-bin \
          "$PYTHON_VERSION"
        PYTHON=$(env -i "${clean[@]}" "$UV" python find --managed-python \
          "$PYTHON_VERSION")
        case "$PYTHON" in
          "$INSTALL_DIR"/*) ;;
          *) echo "Error: uv found Python outside its install directory ❌"
             exit 1 ;;
        esac
        echo "path=$PYTHON" >> "$GITHUB_OUTPUT"

    - name: "Set release schema"
      id: set-release-schema
      shell: bash
      env:
        DISTRIBUTION_TYPE: "${{ inputs['distribution-type'] }}"
      run: |
        # Map the distribution type to the corresponding schema file name
        case "${DISTRIBUTION_TYPE}" in
          artifact)
            release_schema="release-artifact-schema.yaml"
            ;;
          container)
            release_schema="release-container-schema.yaml"
            ;;
          maven)
            release_schema="release-schema.yaml"
            ;;
          npm)
            release_schema="release-npm-schema.yaml"
            ;;
          packagecloud)
            release_schema="release-packagecloud-schema.yaml"
            ;;
          pypi)
            release_schema="release-pypi-schema.yaml"
            ;;
          *)
            echo "ERROR: unsupported distribution-type: ${DISTRIBUTION_TYPE}"
            echo "Supported: artifact, container, maven, npm," \
              "packagecloud, pypi"
            exit 1
            ;;
        esac
        echo "INFO: Schema to compare: ${release_schema}"
        echo "use_schema=${release_schema}" >> "$GITHUB_OUTPUT"

    - name: "Validate against the bundled schema"
      id: validate-schema
      shell: bash
      env:
        USE_SCHEMA: "${{ steps.set-release-schema.outputs.use_schema }}"
        RELEASE_FILE: "${{ inputs['release-file'] }}"
        SCHEMA_REF: "${{ inputs['schema-ref'] }}"
        LFTOOLS_UV_VERSION: "${{ inputs['lftools-uv-version'] }}"
        ACTION_PATH: "${{ github.action_path }}"
        UV: "${{ steps.setup-uv.outputs.uv-path }}"
        INTERPRETER: "${{ steps.python.outputs.path }}"
      # yamllint disable-line rule:line-length
      run: |
        # Fail fast on any command error, undefined variable, or
        # failing pipeline stage so a bad uvx invocation cannot
        # silently fall through to a later step.
        set -euo pipefail

        # The schemas ship with the action (schemas/), so the action's
        # own pinned SHA fixes the schema revision and no schema file
        # is fetched from another repository. (uv and lftools-uv still
        # come from their usual sources.) See schemas/README.md for
        # where each file came from.
        if [ -n "${SCHEMA_REF}" ]; then
          echo "::warning::schema-ref is deprecated and ignored; the" \
            "action validates against its bundled schemas"
        fi
        schema_path="${ACTION_PATH}/schemas/${USE_SCHEMA}"
        if [ ! -f "${schema_path}" ]; then
          echo "ERROR: bundled schema missing: schemas/${USE_SCHEMA}"
          exit 1
        fi

        echo "INFO: Verifying ${RELEASE_FILE} against schema ${USE_SCHEMA}"
        # Run lftools-uv via uv tool run (uvx), which creates an
        # isolated, cached environment for the requested package. The
        # `lftools-uv` command exposes the same `schema verify YAMLFILE
        # SCHEMAFILE` sub-command as the legacy `lftools` tool.
        # --python names the trusted interpreter, so no caller variable
        # picks it, and --no-config ignores uv configuration files, as
        # the extraction below does. The console script would start
        # Python without -I, letting the caller's PYTHONPATH or working
        # directory supply modules, so the environment's own python
        # loads the `lftools-uv` entry point in isolated mode instead.
        if [ -n "${LFTOOLS_UV_VERSION}" ]; then
            spec="lftools-uv==${LFTOOLS_UV_VERSION}"
        else
            spec="lftools-uv"
        fi
        entry_point='import sys
        from importlib.metadata import entry_points
        (script,) = entry_points(group="console_scripts", name="lftools-uv")
        sys.argv[0] = "lftools-uv"
        sys.exit(script.load()())'
        # A caller's PYTHON* variables would reach every Python uv
        # starts, including build backends that run without -I, and
        # PYTHONEXECUTABLE or __PYVENV_LAUNCHER__ reset sys.prefix even
        # under -I. None of them is the action's to honour.
        for name in $(compgen -e); do
          case "${name}" in
            PYTHON*|__PYVENV_LAUNCHER__) unset "${name}" ;;
          esac
        done
        "${UV}" tool run --no-config --python "${INTERPRETER}" \
            --from "${spec}" python -I -c "${entry_point}" schema verify \
            "${RELEASE_FILE}" "${schema_path}"

    # Runs only once validation has passed, since a composite action
    # stops at the first failing step. Outputs therefore describe a
    # file already known to satisfy its schema, and a caller can read
    # them without re-checking validity.
    - name: "Extract release fields"
      id: release-fields
      shell: bash
      env:
        RELEASE_FILE: "${{ inputs['release-file'] }}"
        UV: "${{ steps.setup-uv.outputs.uv-path }}"
        INTERPRETER: "${{ steps.python.outputs.path }}"
      run: |
        set -euo pipefail

        # Parse with PyYAML rather than grep/sed. The release file is
        # YAML, so quoting, comments and type coercion (tag_release is
        # a boolean) all need real parsing; a regex would appear to
        # work on the fixtures and mis-read a file in the field.
        runner_tmp="${RUNNER_TEMP:-$(mktemp -d)}"
        work_dir="$(mktemp -d "${runner_tmp}/vrs-fields.XXXXXX")"
        trap 'rm -rf "${work_dir}"' EXIT

        cat > "${work_dir}/extract.py" <<'PYEOF'
        """Emit release file scalars as GitHub Actions step outputs."""
        import os
        import secrets
        import sys

        import yaml

        FIELDS = (
            "distribution_type",
            "project",
            "version",
            "git_tag",
            "log_dir",
            "ref",
            "tag_release",
        )

        with open(os.environ["RELEASE_FILE"], encoding="utf-8") as handle:
            document = yaml.safe_load(handle)

        # A schema-valid release file is a mapping. Guard anyway: this
        # reads a file an untrusted change may have authored, and
        # .get() on a list raises an opaque AttributeError.
        if not isinstance(document, dict):
            print("ERROR: release file is not a YAML mapping", file=sys.stderr)
            raise SystemExit(1)

        MISSING = object()

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            for field in FIELDS:
                # A sentinel, not .get(field), because .get() returns
                # None for both an absent key and an explicit null.
                # Absence is legitimate and maps to an empty output;
                # 'ref: null' is a value present in the file that is
                # not a string, and belongs with the other type
                # rejections below.
                value = document.get(field, MISSING)
                if value is MISSING:
                    text = ""
                elif field == "tag_release" and isinstance(value, bool):
                    # The one field the schemas type as a boolean.
                    # Rendered as 'true'/'false', not Python's
                    # 'True'/'False'.
                    text = "true" if value else "false"
                elif isinstance(value, str):
                    text = value
                else:
                    # Everything else is refused rather than coerced.
                    # The schemas neither declare every field nor
                    # forbid additional properties, so a release file
                    # can put any YAML type here, and PyYAML has
                    # already discarded the authored text by now:
                    #
                    #   ref: on      -> True  -> would publish 'true'
                    #   ref: 0123    -> 83    -> octal, per YAML 1.1
                    #   ref: [abc]   -> list  -> would publish "['abc']"
                    #   ref: null    -> None  -> indistinguishable
                    #                            from an absent field
                    #
                    # Each would silently rewrite a release
                    # coordinate, breaking the verbatim contract these
                    # outputs document. Quoting preserves the text.
                    #
                    # The expected type is per-field: tag_release is
                    # the one the schemas type as a boolean, so
                    # directing its author to quote the value would
                    # send them to the wrong fix.
                    expected = (
                        "a boolean" if field == "tag_release"
                        else "a quoted string"
                    )
                    print(
                        f"ERROR: {field} is {type(value).__name__}, "
                        f"expected {expected}",
                        file=sys.stderr,
                    )
                    raise SystemExit(1)

                # Heredoc form with a random delimiter. Values come from
                # a file a contributor controls, so a newline in one
                # would otherwise let it forge further outputs.
                delimiter = f"EOF_{secrets.token_hex(16)}"
                while delimiter in text:
                    delimiter = f"EOF_{secrets.token_hex(16)}"
                out.write(f"{field}<<{delimiter}\n{text}\n{delimiter}\n")

                # Log only whether the field is set, never its value.
                # text is contributor-controlled, and a value
                # containing a line such as ::stop-commands:: or
                # ::add-mask:: would be read as a workflow command by
                # the runner. The heredoc above protects
                # GITHUB_OUTPUT; stdout needs protecting separately.
                state = "set" if text else "unset"
                print(f"INFO: {field} {state}")
        PYEOF

        # uv and the interpreter both come by absolute path from the
        # steps above, so no caller variable chooses either. --with
        # keeps PyYAML in an isolated environment rather than installing
        # it into the interpreter itself. --no-project stops uv
        # discovering and syncing a pyproject.toml belonging to the
        # caller, whose workspace this composite step runs in: without
        # it, extraction could fail on the caller's unrelated
        # dependency constraints, or mutate their environment.
        # --no-config stops uv reading a uv.toml of the caller's,
        # which could change the index PyYAML comes from. -I keeps the
        # working directory and PYTHON* variables out of the
        # interpreter's import path.
        #
        # PyYAML is pinned, matching how this action bundles its schemas
        # and lets callers pin lftools-uv-version. An unconstrained spec
        # would resolve the latest release on every invocation, so a
        # caller who had pinned the action SHA (and with it the schemas)
        # and the lftools-uv version still could not reproduce a run, and an
        # upstream release or yank could break the action with no change
        # here. Deliberately not a caller input: PyYAML is an internal
        # implementation detail, and only safe_load is used, which has
        # been stable across the 6.x series.
        # A caller's PYTHON* variables would reach every Python uv
        # starts, including build backends that run without -I, and
        # PYTHONEXECUTABLE or __PYVENV_LAUNCHER__ reset sys.prefix even
        # under -I. None of them is the action's to honour.
        for name in $(compgen -e); do
          case "${name}" in
            PYTHON*|__PYVENV_LAUNCHER__) unset "${name}" ;;
          esac
        done
        "${UV}" run --quiet --no-config --no-project \
            --python "${INTERPRETER}" --with 'pyyaml==6.0.3' \
            python -I "${work_dir}/extract.py"
