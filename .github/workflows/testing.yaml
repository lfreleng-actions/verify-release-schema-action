---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

# Pin lftools-uv-version in this repo's CI so action tests are
# reproducible and don't depend on whatever version of lftools-uv
# happens to be the latest on PyPI on a given day. Consumers of the
# action still get latest by default (see the action's input contract).
env:
  LFTOOLS_UV_VERSION: "0.1.8"

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Expected outputs are declared per fixture rather than derived,
        # so a change in extraction behaviour has to be restated here
        # deliberately. Empty strings are meaningful: they assert the
        # documented absent-field contract, not an absence of coverage.
        include:
          - distribution: "maven"
            fixture: "tests/releases/test-release-maven.yaml"
            want_distribution_type: "maven"
            want_project: "test-project"
            want_version: "1.0.0"
            want_git_tag: "v1.0.0"
            want_log_dir: "test-job/42"
            want_ref: ""
            want_tag_release: "true"
          # Optional-field coverage: no git_tag, tag_release false, and
          # a ref on a maven release. Matches real ONAP release files.
          - distribution: "maven"
            fixture: "tests/releases/test-release-maven-minimal.yaml"
            want_distribution_type: "maven"
            want_project: "test-project-minimal"
            want_version: "2.0.0"
            want_git_tag: ""
            want_log_dir: "test-job/43"
            want_ref: "89abcdef0123456789abcdef0123456789abcdef"
            want_tag_release: "false"
          # Multiline coverage. Every other fixture carries single-line
          # scalars, so without this the heredoc serialisation -- the
          # part that stops a crafted value forging further outputs --
          # goes untested. The newline must survive intact.
          - distribution: "maven"
            fixture: "tests/releases/test-release-maven-multiline.yaml"
            want_distribution_type: "maven"
            want_project: "first line\nsecond line"
            want_version: "7.0.0"
            want_git_tag: ""
            want_log_dir: "test-job/48"
            want_ref: ""
            want_tag_release: ""
          - distribution: "container"
            fixture: "tests/releases/test-release-container.yaml"
            want_distribution_type: "container"
            want_project: "test-project"
            want_version: ""
            want_git_tag: "v1.0.0"
            want_log_dir: ""
            want_ref: "0123456789abcdef0123456789abcdef01234567"
            want_tag_release: "true"
          - distribution: "artifact"
            fixture: "tests/releases/test-release-artifact.yaml"
            want_distribution_type: "artifact"
            want_project: "test-project"
            want_version: "1.0.0"
            want_git_tag: "v1.0.0"
            want_log_dir: ""
            want_ref: ""
            want_tag_release: "true"
          - distribution: "packagecloud"
            fixture: "tests/releases/test-release-packagecloud.yaml"
            want_distribution_type: ""
            want_project: ""
            want_version: "1.0.0"
            want_git_tag: "v1.0.0"
            want_log_dir: "test-job/42"
            want_ref: "0123456789abcdef0123456789abcdef01234567"
            want_tag_release: "true"
          - distribution: "pypi"
            fixture: "tests/releases/test-release-pypi.yaml"
            want_distribution_type: ""
            want_project: ""
            want_version: "1.0.0"
            want_git_tag: "v1.0.0"
            want_log_dir: "test-job/42"
            want_ref: ""
            want_tag_release: "true"
          # The shape real ONAP npm release files take: a project and
          # an unquoted version, nothing else.
          - distribution: "npm"
            fixture: "tests/releases/test-release-npm-minimal.yaml"
            want_distribution_type: ""
            want_project: "onap-ui-common"
            want_version: "1.1.2"
            want_git_tag: ""
            want_log_dir: ""
            want_ref: ""
            want_tag_release: ""
          # Every optional field, with a prerelease and build metadata.
          - distribution: "npm"
            fixture: "tests/releases/test-release-npm.yaml"
            want_distribution_type: "npm"
            want_project: "test-npm-project"
            want_version: "2.0.0-rc.1+build.01"
            want_git_tag: "v2.0.0-rc.1"
            want_log_dir: ""
            want_ref: "0123456789abcdef0123456789abcdef01234567"
            want_tag_release: "false"
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ----------------------------------------------------------------
      # Success path: validate a well-formed release file against the
      # corresponding schema. Each matrix entry exercises a different
      # distribution-type so we get coverage across supported schemas.
      # ----------------------------------------------------------------
      - name: "Verify ${{ matrix.distribution }} release (success)"
        id: verify
        uses: $/
        with:
          distribution-type: "${{ matrix.distribution }}"
          release-file: "${{ matrix.fixture }}"
          lftools-uv-version: "${{ env.LFTOOLS_UV_VERSION }}"

      # Assert every declared output against the fixture's expected
      # value. All seven are checked on every fixture, including the
      # ones expected to be empty: a partial check would let incorrect
      # wiring, a wrong value, or a regression in the documented
      # absent-field behaviour pass CI unnoticed.
      - name: "Assert outputs for ${{ matrix.fixture }}"
        shell: bash
        env:
          WANT_DISTRIBUTION_TYPE: "${{ matrix.want_distribution_type }}"
          WANT_PROJECT: "${{ matrix.want_project }}"
          WANT_VERSION: "${{ matrix.want_version }}"
          WANT_GIT_TAG: "${{ matrix.want_git_tag }}"
          WANT_LOG_DIR: "${{ matrix.want_log_dir }}"
          WANT_REF: "${{ matrix.want_ref }}"
          WANT_TAG_RELEASE: "${{ matrix.want_tag_release }}"
          GOT_DISTRIBUTION_TYPE: "${{ steps.verify.outputs.distribution_type }}"
          GOT_PROJECT: "${{ steps.verify.outputs.project }}"
          GOT_VERSION: "${{ steps.verify.outputs.version }}"
          GOT_GIT_TAG: "${{ steps.verify.outputs.git_tag }}"
          GOT_LOG_DIR: "${{ steps.verify.outputs.log_dir }}"
          GOT_REF: "${{ steps.verify.outputs.ref }}"
          GOT_TAG_RELEASE: "${{ steps.verify.outputs.tag_release }}"
        run: |
          set -euo pipefail
          rc=0

          check() {
            # $1 output name, $2 expected, $3 actual
            if [ "$2" != "$3" ]; then
              # %q escapes both values onto a single line. The actual
              # value originates in a release file, and a multiline
              # scalar could otherwise put a line such as
              # ::stop-commands:: on stdout, which the runner treats
              # as a workflow command.
              printf 'ERROR: %s: expected %q, got %q ❌\n' "$1" "$2" "$3"
              rc=1
            fi
          }

          check distribution_type \
            "${WANT_DISTRIBUTION_TYPE}" "${GOT_DISTRIBUTION_TYPE}"
          check project "${WANT_PROJECT}" "${GOT_PROJECT}"
          check version "${WANT_VERSION}" "${GOT_VERSION}"
          check git_tag "${WANT_GIT_TAG}" "${GOT_GIT_TAG}"
          check log_dir "${WANT_LOG_DIR}" "${GOT_LOG_DIR}"
          check ref "${WANT_REF}" "${GOT_REF}"
          # Guards YAML boolean serialisation: 'true'/'false', never
          # Python's 'True'/'False'.
          check tag_release "${WANT_TAG_RELEASE}" "${GOT_TAG_RELEASE}"

          if [ "${rc}" -eq 0 ]; then
            echo "All seven outputs match fixture ✅"
          fi
          exit "${rc}"

      - name: "Success path validated: ${{ matrix.distribution }}"
        shell: bash
        env:
          DIST: "${{ matrix.distribution }}"
        run: |
          # Report success to the workflow summary
          msg="Validated ${DIST} release ✅"
          echo "${msg}"
          echo "- ${msg}" >> "$GITHUB_STEP_SUMMARY"

  # The bundled schemas imported from lfit/releng-global-jjb must stay
  # byte-identical to the revision schemas/README.md records, so a
  # change to one is a deliberate update of the digest rather than an
  # unnoticed edit. The check reads the digests committed here, so it
  # never fetches a schema from upstream to compare against.
  schema-integrity:
    name: "Verify bundled schema digests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Check imported schemas against recorded digests"
        shell: bash
        working-directory: schemas
        run: |
          set -euo pipefail
          sha256sum --check --strict global-jjb.sha256
          # Every imported schema the action maps a type to must be
          # covered, so a file added without a digest fails here.
          for schema in release-*-schema.yaml release-schema.yaml; do
            if ! grep -q " ${schema}\$" global-jjb.sha256 \
              && grep -q 'releng-global-jjb' "${schema}"; then
              echo "ERROR: ${schema} is imported but has no digest ❌"
              exit 1
            fi
          done
          echo "Bundled schemas match their recorded digests ✅"

  # A restored GitHub Actions cache would feed the environment that
  # validates release files, so a cache written by a less-trusted run
  # could change the result (CWE-349). setup-uv's default, 'auto',
  # caches on push events, so every setup-uv step here must set
  # enable-cache to false explicitly; this keeps one from coming back.
  setup-uv-cache:
    name: "Assert every setup-uv step disables caching"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false

      # Parsed as YAML rather than grepped, so a setting in a comment,
      # in another step or under another key cannot satisfy the check.
      - name: "Check setup-uv steps in the action and workflows"
        shell: bash
        run: |
          set -euo pipefail
          uv run --quiet --no-config --no-project --with 'pyyaml==6.0.3' \
            python -I - <<'PYEOF'
          import glob
          import sys

          import yaml

          paths = ["action.yaml"] + sorted(
              glob.glob(".github/workflows/*.yaml")
              + glob.glob(".github/workflows/*.yml")
          )

          def steps_of(document):
              if not isinstance(document, dict):
                  return
              runs = document.get("runs")
              if isinstance(runs, dict):
                  for step in runs.get("steps") or []:
                      yield "runs", step
              jobs = document.get("jobs")
              if isinstance(jobs, dict):
                  for job_id, job in jobs.items():
                      if isinstance(job, dict):
                          for step in job.get("steps") or []:
                              yield f"jobs.{job_id}", step

          failures = []
          checked = 0
          for path in paths:
              with open(path, encoding="utf-8") as handle:
                  document = yaml.safe_load(handle)
              for where, step in steps_of(document):
                  if not isinstance(step, dict):
                      continue
                  uses = str(step.get("uses", ""))
                  if uses.split("@", 1)[0] != "astral-sh/setup-uv":
                      continue
                  checked += 1
                  name = f"{where}: '{step.get('name') or uses}'"
                  settings = step.get("with") or {}
                  missing = object()
                  value = settings.get("enable-cache", missing)
                  if value is missing:
                      failures.append(f"{path}: {name} omits enable-cache")
                  elif value is not False and value != "false":
                      failures.append(
                          f"{path}: {name} sets enable-cache: {value!r}"
                      )

          for failure in failures:
              print(f"ERROR: {failure} \u274c")
          if checked == 0:
              print("ERROR: no setup-uv steps found to check \u274c")
              sys.exit(1)
          if failures:
              sys.exit(1)
          print(f"{checked} setup-uv steps disable caching \u2705")
          PYEOF

  # Dedicated job for failure-path testing so matrix parallelism doesn't
  # hide regressions specific to a single negative case.
  failure-tests:
    name: "Test failure cases"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ----------------------------------------------------------------
      # Failure path 1: unsupported distribution-type should cause the
      # action to exit non-zero (fail fast), even though the release
      # file path is otherwise valid.
      # ----------------------------------------------------------------
      - name: "Unsupported distribution-type (should fail)"
        id: unsupported
        continue-on-error: true
        uses: $/
        with:
          distribution-type: "unsupported-type"
          release-file: "tests/releases/test-release-maven.yaml"
          lftools-uv-version: "${{ env.LFTOOLS_UV_VERSION }}"

      - name: "Assert unsupported distribution-type failed"
        if: steps.unsupported.outcome == 'success'
        shell: bash
        run: |
          # The action must fail fast on unknown distribution-type values
          echo "ERROR: unsupported distribution-type did NOT fail ❌"
          exit 1

      # ----------------------------------------------------------------
      # Failure path 2: a release file that does NOT satisfy the schema
      # must produce a non-zero exit from lftools schema verify.
      # ----------------------------------------------------------------
      - name: "Invalid release file (should fail)"
        id: invalid
        continue-on-error: true
        uses: $/
        with:
          distribution-type: "maven"
          release-file: "tests/releases/test-release-invalid.yaml"
          lftools-uv-version: "${{ env.LFTOOLS_UV_VERSION }}"

      - name: "Assert invalid release file failed"
        if: steps.invalid.outcome == 'success'
        shell: bash
        run: |
          # A release file missing required fields must fail validation
          echo "ERROR: invalid release file did NOT fail schema check ❌"
          exit 1

      # ----------------------------------------------------------------
      # Failure path 3: a missing release file should also cause the
      # action to fail (lftools cannot open the file).
      # ----------------------------------------------------------------
      - name: "Missing release file (should fail)"
        id: missing
        continue-on-error: true
        uses: $/
        with:
          distribution-type: "maven"
          release-file: "tests/releases/does-not-exist.yaml"
          lftools-uv-version: "${{ env.LFTOOLS_UV_VERSION }}"

      - name: "Assert missing release file failed"
        if: steps.missing.outcome == 'success'
        shell: bash
        run: |
          # A missing release file must not silently succeed
          echo "ERROR: missing release file did NOT fail ❌"
          exit 1

      # ----------------------------------------------------------------
      # schema-ref is deprecated: a caller still passing it must keep
      # working (the value is ignored, with a warning), so removing the
      # input never breaks a pinned consumer.
      # ----------------------------------------------------------------
      - name: "Deprecated schema-ref is ignored (should pass)"
        uses: $/
        with:
          distribution-type: "maven"
          release-file: "tests/releases/test-release-maven.yaml"
          lftools-uv-version: "${{ env.LFTOOLS_UV_VERSION }}"
          schema-ref: "09659ce65d005b15595a44bbef6304fd3cc83ac1"

      # ----------------------------------------------------------------
      - name: "All failure-path assertions passed"
        shell: bash
        run: |
          # Report aggregated failure-path success to the workflow summary
          msg="All failure-path assertions passed ✅"
          echo "${msg}"
          echo "- ${msg}" >> "$GITHUB_STEP_SUMMARY"

  # The npm schema is this repository's own, so its rules are tested
  # here rather than inherited: each fixture breaks exactly one of
  # them and must be rejected.
  npm-rejections:
    name: "Test npm schema rejections"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: "no version"
            fixture: "tests/releases/test-release-npm-noversion.yaml"
          - case: "two-part version"
            fixture: "tests/releases/test-release-npm-shortversion.yaml"
          - case: "leading zero"
            fixture: "tests/releases/test-release-npm-leadingzero.yaml"
          - case: "zero-padded prerelease"
            fixture: "tests/releases/test-release-npm-prereleasezero.yaml"
          - case: "trailing newline"
            fixture: "tests/releases/test-release-npm-newline.yaml"
          - case: "another distribution_type"
            fixture: "tests/releases/test-release-npm-wrongtype.yaml"
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "npm release with ${{ matrix.case }} (should fail)"
        id: reject
        continue-on-error: true
        uses: $/
        with:
          distribution-type: "npm"
          release-file: "${{ matrix.fixture }}"
          lftools-uv-version: "${{ env.LFTOOLS_UV_VERSION }}"

      - name: "Assert ${{ matrix.case }} was rejected"
        shell: bash
        env:
          CASE: "${{ matrix.case }}"
          OUTCOME: "${{ steps.reject.outcome }}"
        run: |
          set -euo pipefail
          if [ "${OUTCOME}" = "success" ]; then
            printf 'ERROR: npm release with %s was accepted ❌\n' "${CASE}"
            exit 1
          fi
          printf 'Rejected npm release with %s ✅\n' "${CASE}"

  # The npm version pattern, tested as a regular expression against a
  # table of SemVer 2.0.0 strings, read straight from the schema so the
  # table always exercises the committed pattern. The fixtures above
  # prove the action wiring; this covers the grammar's branches, which
  # one fixture per case could not do economically.
  npm-version-pattern:
    name: "Test npm version pattern"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false

      # Python's re, as the validator (jsonschema's Draft4Validator)
      # uses, so '$' semantics match what the action enforces.
      - name: "Check the pattern against SemVer cases"
        shell: bash
        run: |
          set -euo pipefail
          uv run --quiet --no-config --no-project --with 'pyyaml==6.0.3' \
            python -I - <<'PYEOF'
          import re
          import sys

          import yaml

          with open("schemas/release-npm-schema.yaml", encoding="utf-8") as f:
              schema = yaml.safe_load(f)
          pattern = schema["properties"]["version"]["pattern"]

          valid = [
              "0.0.0", "1.1.2", "10.20.30", "2.0.0-rc.1", "1.0.0-alpha",
              "1.0.0-alpha.1", "1.0.0-0.3.7", "1.0.0-x.7.z.92",
              "1.0.0-x-y-z.--", "1.0.0-0A.is.legal", "1.0.0-alpha+001",
              "1.0.0+20130313144700", "1.0.0+build.01",
              "1.0.0-beta+exp.sha.5114f85", "1.0.0-rc.1+build.123",
          ]
          invalid = [
              "1.1", "1", "1.01.0", "01.1.0", "1.0.0-01", "1.0.0-alpha.01",
              "1.0.0-", "1.0.0+", "1.0.0-alpha..1", "1.0.0+build..1",
              "1.0.0-alpha_beta", "v1.0.0", " 1.0.0", "1.0.0 ",
              "1.2.3\n", "1.2.3\n\n", "1.2.3\r", "\n1.2.3",
          ]
          wrong = [v for v in valid if not re.search(pattern, v)]
          wrong += [v for v in invalid if re.search(pattern, v)]
          for value in wrong:
              print(f"ERROR: pattern misjudges {value!r} \u274c")
          if wrong:
              sys.exit(1)
          print(f"{len(valid)} valid and {len(invalid)} invalid cases \u2705")
          PYEOF

  # Guards that live in extraction rather than the schema. Each fixture
  # is schema-VALID but carries a value the outputs cannot publish
  # faithfully, so the schema cannot catch it and only the extractor
  # can. A matrix keeps them uniform: adding the next coercion hazard
  # is a fixture plus one row.
  extraction-guards:
    name: "Test extraction guards"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - guard: "non-scalar"
            fixture: "tests/releases/test-release-maven-nonscalar.yaml"
            reason: "a list would publish Python's repr"
          - guard: "YAML 1.1 boolean"
            fixture: "tests/releases/test-release-maven-yamlbool.yaml"
            reason: "'ref: on' would publish 'true'"
          - guard: "YAML 1.1 numeric"
            fixture: "tests/releases/test-release-maven-numeric.yaml"
            reason: "'ref: 0123' would publish octal '83'"
          # Without this, swapping the extractor's MISSING sentinel for
          # a plain .get() would pass every other guard while silently
          # publishing an explicit null as an empty output.
          - guard: "explicit null"
            fixture: "tests/releases/test-release-maven-null.yaml"
            reason: "'ref: null' is a value, not an absent field"
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The precheck below runs uvx directly rather than through the
      # action, so this job installs uv itself. Pinned to match the
      # action's own setup step, so the precheck and the action agree
      # on the toolchain as well as on the schema revision.
      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false

      # The fixture MUST validate for the assertion below to mean
      # anything. Were the schema to reject it, the action would fail
      # for that reason and the test would pass without ever reaching
      # the guard. No continue-on-error here, so that regression is
      # loud rather than silent. Uses the bundled schema the action
      # invocation below validates against, so the two cannot disagree.
      - name: "Confirm ${{ matrix.guard }} fixture is schema-valid"
        shell: bash
        env:
          FIXTURE: "${{ matrix.fixture }}"
        run: |
          set -euo pipefail
          uvx --from "lftools-uv==${LFTOOLS_UV_VERSION}" \
            lftools-uv schema verify "${FIXTURE}" \
            schemas/release-schema.yaml
          echo "Schema-valid, so only extraction can reject it ✅"

      - name: "${{ matrix.guard }} (should fail)"
        id: guard
        continue-on-error: true
        uses: $/
        with:
          distribution-type: "maven"
          release-file: "${{ matrix.fixture }}"
          lftools-uv-version: "${{ env.LFTOOLS_UV_VERSION }}"

      - name: "Assert ${{ matrix.guard }} failed"
        shell: bash
        env:
          GUARD: "${{ matrix.guard }}"
          REASON: "${{ matrix.reason }}"
          OUTCOME: "${{ steps.guard.outcome }}"
        run: |
          set -euo pipefail
          if [ "${OUTCOME}" = "success" ]; then
            printf 'ERROR: %s was accepted; %s ❌\n' "${GUARD}" "${REASON}"
            exit 1
          fi
          printf 'Rejected %s (%s) ✅\n' "${GUARD}" "${REASON}"

  # The action runs uv and Python from the caller's workspace. Files
  # there must not choose the interpreter, the package index or the
  # modules the extraction imports: each planted file records that it
  # ran and fails, and the uv.toml points the index at a host that
  # does not resolve. The action must still pass with real outputs.
  # The action runs from the workspace here, so the planted .venv is
  # in its directory, where its own interpreter lookups must skip it,
  # and so is a pyproject.toml requiring a Python no runner has, which
  # those lookups must not apply.
  workspace-isolation:
    name: "Test the action ignores files in the workspace"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Plant files in the workspace"
        shell: bash
        run: |
          set -euo pipefail
          marker="${RUNNER_TEMP}/planted-ran"
          mkdir -p yaml
          for module in yaml/__init__.py secrets.py sitecustomize.py; do
            printf '%s\n' 'import sys' \
              "open('${marker}', 'a').write(__file__ + '\n')" \
              'sys.exit(97)' > "${module}"
          done
          printf '%s\n' '#!/bin/sh' "echo \"\$0\" >> '${marker}'" \
            'exit 97' > planted-python
          chmod +x planted-python
          mkdir -p .venv/bin
          echo 'home = /usr/bin' > .venv/pyvenv.cfg
          for interpreter in .venv/bin/python .venv/bin/python3; do
            cp planted-python "${interpreter}"
          done
          echo "${GITHUB_WORKSPACE}/planted-python" > .python-version
          printf '%s\n' '[[index]]' \
            'url = "https://pypi.invalid/simple"' 'default = true' \
            > uv.toml
          printf '%s\n' '[project]' 'name = "planted"' 'version = "0"' \
            'requires-python = ">=3.99"' > pyproject.toml
          echo "Files planted ✅"

      - name: "Verify maven release with planted files"
        id: verify
        uses: $/
        with:
          distribution-type: "maven"
          release-file: "tests/releases/test-release-maven.yaml"
          lftools-uv-version: "${{ env.LFTOOLS_UV_VERSION }}"

      - name: "Assert real outputs and no planted file ran"
        shell: bash
        env:
          GOT_DISTRIBUTION_TYPE: "${{ steps.verify.outputs.distribution_type }}"
          GOT_PROJECT: "${{ steps.verify.outputs.project }}"
          GOT_VERSION: "${{ steps.verify.outputs.version }}"
          GOT_TAG_RELEASE: "${{ steps.verify.outputs.tag_release }}"
        run: |
          set -euo pipefail
          rc=0
          check() {
            # $1 output name, $2 expected, $3 actual
            if [ "$2" != "$3" ]; then
              printf 'ERROR: %s: expected %q, got %q ❌\n' "$1" "$2" "$3"
              rc=1
            fi
          }
          check distribution_type maven "${GOT_DISTRIBUTION_TYPE}"
          check project test-project "${GOT_PROJECT}"
          check version 1.0.0 "${GOT_VERSION}"
          check tag_release true "${GOT_TAG_RELEASE}"
          if [ -e "${RUNNER_TEMP}/planted-ran" ]; then
            echo "ERROR: files planted in the workspace ran ❌"
            cat "${RUNNER_TEMP}/planted-ran"
            rc=1
          fi
          if [ "${rc}" -eq 0 ]; then
            echo "Real outputs, and no planted file ran ✅"
          fi
          exit "${rc}"

      # extract.py runs from RUNNER_TEMP in script mode, so the run
      # above cannot tell whether its python has -I. Run the shipped
      # step script on its own with PYTHONPATH naming planted modules,
      # where -I is what keeps them out, and run a copy without -I as a
      # control: unless the control loads them, the check proves
      # nothing and fails.
      #
      # The run above uses the action from the workspace itself, where
      # the action directory is the workspace and holds the planted
      # .venv, so only the lookups' --system and UV_SYSTEM_PYTHON keep
      # it out. Here the step also runs with GITHUB_ACTION_PATH set to
      # a copy of the action outside the workspace, as for a published
      # action under _actions/. A copy of the step without --python,
      # the previous extraction call, is the control that must run the
      # planted interpreter there; a copy whose lookup lacks --system
      # must run it with the action in the workspace. A copy whose
      # lookups lack --no-project must, with the action in the
      # workspace, apply the planted pyproject.toml's requires-python,
      # find no interpreter and stop; any Python it installs goes to a
      # scratch directory, leaving the runner's uv-managed Pythons as
      # they were.
      - name: "Extraction ignores PYTHONPATH and a workspace .venv"
        shell: bash
        env:
          RELEASE_FILE: "tests/releases/test-release-maven.yaml"
        run: |
          set -euo pipefail
          planted="${RUNNER_TEMP}/planted-path"
          marker="${RUNNER_TEMP}/planted-path-ran"
          venv_marker="${RUNNER_TEMP}/planted-venv-ran"
          mkdir -p "${planted}/yaml"
          for module in yaml/__init__.py secrets.py sitecustomize.py; do
            printf '%s\n' 'import sys' \
              "open('${marker}', 'a').write(__file__ + '\n')" \
              'sys.exit(97)' > "${planted}/${module}"
          done
          step="${RUNNER_TEMP}/release-fields.sh"
          # Remove the .venv planted for the action run above and plant
          # it again further down: this helper runs uv from the
          # workspace without an absolute --python.
          rm -rf .venv
          uv run --quiet --no-config --no-project --with pyyaml==6.0.3 \
            python -I - action.yaml "${step}" <<'PYEOF'
          import sys
          import yaml
          with open(sys.argv[1], encoding="utf-8") as handle:
              steps = yaml.safe_load(handle)["runs"]["steps"]
          script = next(
              s["run"] for s in steps if s.get("id") == "release-fields"
          )
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              handle.write(script)
          PYEOF

          # The extraction call as action.yaml writes it, line by line.
          cat > "${step}.call" <<'EOF'
          uv run --quiet --no-config --no-project --python "${py}" \
              --with 'pyyaml==6.0.3' python -I "${work_dir}/extract.py"
          EOF
          while IFS= read -r line; do
            grep -qxF -- "${line}" "${step}" || {
              echo "ERROR: the extraction call changed; update this check ❌"
              exit 1
            }
          done < "${step}.call"
          sed 's/python -I "/python "/' "${step}" > "${step}.control"
          # The pattern is literal text from action.yaml, not shell.
          # shellcheck disable=SC2016
          sed 's/ --python "\${py}"//' "${step}" > "${step}.venv-control"
          sed 's/uv python find --system/uv python find/' "${step}" \
            > "${step}.system-control"
          sed 's/find --system --no-project/find --system/' "${step}" \
            > "${step}.project-control"
          for control in "${step}.control" "${step}.venv-control" \
            "${step}.system-control" "${step}.project-control"; do
            if cmp -s "${step}" "${control}"; then
              echo "ERROR: ${control##*/} is not a changed copy ❌"
              exit 1
            fi
          done

          action_copy="${RUNNER_TEMP}/action-copy"
          mkdir -p "${action_copy}"
          cp action.yaml "${action_copy}/"
          mkdir -p .venv/bin
          echo 'home = /usr/bin' > .venv/pyvenv.cfg
          for interpreter in .venv/bin/python .venv/bin/python3; do
            printf '%s\n' '#!/bin/sh' \
              "echo \"\$0\" >> '${venv_marker}'" 'exit 97' > "${interpreter}"
            chmod +x "${interpreter}"
          done

          run_step() {
            # $1 script, $2 action directory; prints the step's output
            # and keeps its log in fields-log
            rm -f "${marker}" "${venv_marker}"
            : > "${RUNNER_TEMP}/fields-output"
            GITHUB_OUTPUT="${RUNNER_TEMP}/fields-output" \
              GITHUB_ACTION_PATH="$2" PYTHONPATH="${planted}" \
              bash "$1" > "${RUNNER_TEMP}/fields-log" 2>&1 || true
            cat "${RUNNER_TEMP}/fields-output"
          }
          check_shipped() {
            # $1 output of the shipped step, $2 layout
            if [ -e "${marker}" ]; then
              echo "ERROR: the shipped step loaded a planted module" \
                "($2) ❌"
              cat "${marker}"
              exit 1
            fi
            if [ -e "${venv_marker}" ]; then
              echo "ERROR: the shipped step ran the planted .venv ($2) ❌"
              cat "${venv_marker}"
              exit 1
            fi
            if ! grep -A1 '^project<<' <<< "$1" \
              | grep -qx 'test-project'; then
              echo "ERROR: the shipped step did not write project ($2) ❌"
              printf '%s\n' "$1"
              exit 1
            fi
          }

          run_step "${step}.control" "${action_copy}" > /dev/null
          if [ ! -e "${marker}" ]; then
            echo "ERROR: the control without -I loaded no planted module ❌"
            exit 1
          fi
          echo "Control without -I loaded: $(tr '\n' ' ' < "${marker}")"

          run_step "${step}.venv-control" "${action_copy}" > /dev/null
          if [ ! -e "${venv_marker}" ]; then
            echo "ERROR: the control without --python ran no planted" \
              "interpreter ❌"
            exit 1
          fi
          echo "Control without --python ran:" \
            "$(tr '\n' ' ' < "${venv_marker}")"

          run_step "${step}.system-control" "${GITHUB_WORKSPACE}" \
            > /dev/null
          if [ ! -e "${venv_marker}" ]; then
            echo "ERROR: the control without --system ran no planted" \
              "interpreter ❌"
            exit 1
          fi
          echo "Control without --system ran:" \
            "$(tr '\n' ' ' < "${venv_marker}")"

          scratch_python="${RUNNER_TEMP}/project-control-python"
          project_output="$(
            UV_PYTHON_INSTALL_DIR="${scratch_python}/install" \
              UV_PYTHON_BIN_DIR="${scratch_python}/bin" \
              run_step "${step}.project-control" "${GITHUB_WORKSPACE}"
          )"
          rm -rf "${scratch_python}"
          if [ -n "${project_output}" ] || ! grep -q \
            'no Python interpreter found' "${RUNNER_TEMP}/fields-log"; then
            echo "ERROR: the control without --no-project did not stop" \
              "on the planted requires-python ❌"
            cat "${RUNNER_TEMP}/fields-log"
            exit 1
          fi
          echo "Control without --no-project found no interpreter"

          check_shipped "$(run_step "${step}" "${action_copy}")" \
            "action outside the workspace"
          check_shipped "$(run_step "${step}" "${GITHUB_WORKSPACE}")" \
            "action in the workspace"
          echo "Extraction ignores PYTHONPATH and a workspace .venv ✅"
